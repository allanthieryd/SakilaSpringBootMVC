### version: "3.9"

# Environnement de TP .  
#
#  docker compose up -d
#  docker compose --profile observability up -d      # + Prometheus/Grafana/Alertmanager
#  docker compose down -v                            # remise a zero complete

services:
  postgres:
    image: postgres:16-alpine
    container_name: perf-postgres
    environment:
      POSTGRES_DB: perfdb
      POSTGRES_USER: perf
      POSTGRES_PASSWORD: perf
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.max=1000
      - -c
      - log_min_duration_statement=50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perf -d perfdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: perf-pgadmin
    profiles: ["db-tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: perf@local
      PGADMIN_DEFAULT_PASSWORD: perf
    ports:
      - "5050:80"
    depends_on:
      - postgres

  # Service Redis : deplace ici dans la section services (il etait declare sous
  # volumes dans le fichier d'origine, d'ou l'erreur de validation).
  redis-cache:
    image: redis:7-alpine
    container_name: perf-redis
    profiles: ["cache"]
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: perf-prometheus
    profiles: ["observability"]
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: perf-grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: perf
      GF_SECURITY_ADMIN_PASSWORD: perf
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: perf-alertmanager
    profiles: ["observability"]
    ports:
      - "9093:9093"

volumes:
  pgdata:
  grafana-data:
