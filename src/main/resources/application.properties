logging.level.org.springframework.web=TRACE
spring.profiles.active=dev

spring.datasource.url=jdbc:mysql://localhost:3306/sakila
spring.datasource.username=sakila
spring.datasource.password=p_ssW0rd

hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

bootui.enabled=ON
spring.devtools.livereload.enabled=true
bootui.dev-services.restart-enabled=true

# --- Observabilite / KPI (voir 03_KPI.pdf) ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
# /actuator/health/liveness et /actuator/health/readiness
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
# Histogramme + percentiles p50/p95/p99 pour la latence HTTP
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
# Metriques Hibernate (requetes, transactions, cache...)
spring.jpa.properties.hibernate.generate_statistics=true
